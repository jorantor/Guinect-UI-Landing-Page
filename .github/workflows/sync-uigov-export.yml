name: Apply original Webflow export to review branch
on:
  push:
    branches:
      - review/uigov-home-funcionalidades-footer-2026-11-13
    paths:
      - 'uigov.webflow*.zip'
      - 'uigov-export.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'jorantor/Guinect-UI-Landing-Page'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the personal landing review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Restore readable import script
        run: |
          python3 -c "import base64,zlib,pathlib; p=pathlib.Path('scripts/apply-uigov-export.py.zlib.b64'); pathlib.Path('scripts/apply-uigov-export.py').write_bytes(zlib.decompress(base64.b64decode(p.read_text()))); p.unlink()"
      - name: Copy exact original Webflow files and footer
        run: python3 scripts/apply-uigov-export.py
      - name: Commit changes to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import original Webflow HTML, CSS, JS and assets; sync footer'
            git push origin HEAD:${{ github.ref_name }}
          fi
